name: CI

on:
  push:
    branches:
      - fix/vulkan-shader-bundle-memory
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m unittest discover tests

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Compile per-game NativeActivity Java classes
        run: |
          mkdir -p "$RUNNER_TEMP/nx2a-classes" "$RUNNER_TEMP/nx2a-dex"
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$RUNNER_TEMP/nx2a-classes" nxnative/dm/android/java/org/nx2a/*.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output "$RUNNER_TEMP/nx2a-dex" "$RUNNER_TEMP"/nx2a-classes/org/nx2a/*.class
      - name: Build Android native host for the existing per-game APK target
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          python nxnative/dm/android/build.py --game 0100000000010000 \
            --ndk "$ANDROID_NDK_HOME" --out "$RUNNER_TEMP/nx2a-host" \
            --lib --release --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: nx2android-android-smoke-build
          path: |
            ${{ runner.temp }}/nx2a-host/libdmhost.so
            ${{ runner.temp }}/nx2a-dex/classes.dex
